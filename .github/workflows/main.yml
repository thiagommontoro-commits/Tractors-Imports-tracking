name: Atualizar Dashboard Comex Stat

on:
  schedule:
    # Toda segunda-feira às 09:00 UTC (06:00 no horário de Brasília).
    - cron: "0 9 * * 1"
  workflow_dispatch:   # permite rodar manualmente pelo botão "Run workflow"

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      # Roda o script e GARANTE que o index.html fique na raiz do repositório.
      - name: Gerar dashboard (puxar dados do Comex Stat)
        env:
          COMEXSTAT_OUTDIR: ${{ github.workspace }}   # pede para salvar na raiz
        run: |
          set -e
          echo "=== Rodando o script ==="
          python gerar_dashboard.py

          echo "=== Procurando o index.html gerado ==="
          if [ -f index.html ]; then
            echo "OK: index.html está na raiz."
          else
            FOUND="$(find . -name 'index.html' -not -path './.git/*' | head -1 || true)"
            if [ -n "$FOUND" ]; then
              echo "Encontrado em: $FOUND — copiando para a raiz."
              cp "$FOUND" ./index.html
            else
              echo "❌ ERRO: nenhum index.html foi gerado."
              exit 1
            fi
          fi

      # Publica APENAS se os dados mudaram (ignora só o horário de geração).
      # Usa comparação por hash md5 — robusta e com log claro para diagnóstico.
      - name: Publicar se houver atualização
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Neutraliza o campo "gerado_em" (que muda a cada rodada) antes de comparar.
          NEUTRO='s/"gerado_em":[[:space:]]*"[^"]*"/"gerado_em":""/g'

          # Hash da versão JÁ PUBLICADA (a que está no último commit).
          if git cat-file -e HEAD:index.html 2>/dev/null; then
            OLD_HASH="$(git show HEAD:index.html | sed "$NEUTRO" | md5sum | cut -d' ' -f1)"
          else
            OLD_HASH="nenhum-arquivo-anterior"
          fi

          # Hash da versão RECÉM-GERADA (a que está no disco agora).
          NEW_HASH="$(sed "$NEUTRO" index.html | md5sum | cut -d' ' -f1)"

          echo "Hash publicado : $OLD_HASH"
          echo "Hash novo      : $NEW_HASH"

          if [ "$OLD_HASH" = "$NEW_HASH" ]; then
            echo "✅ Sem novidades: os dados não mudaram desde a última publicação."
          else
            echo "🆕 Dados novos detectados! Publicando o dashboard atualizado..."
            git add index.html
            git commit -m "Atualiza dashboard Comex Stat (automatico) [skip ci]"
            git push
            echo "✅ Publicado com sucesso."
          fi
