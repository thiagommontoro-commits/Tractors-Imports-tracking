name: Atualizar Dashboard Comex Stat

on:
  schedule:
    # Toda segunda-feira às 09:00 UTC (06:00 no horário de Brasília).
    - cron: "0 9 * * 1"
  workflow_dispatch:   # permite rodar manualmente pelo botão "Run workflow"

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      # Roda o script e GARANTE que o index.html fique na raiz do repositório,
      # não importa onde o script tenha salvo (raiz ou alguma subpasta).
      - name: Gerar dashboard (puxar dados do Comex Stat)
        env:
          COMEXSTAT_OUTDIR: ${{ github.workspace }}   # pede para salvar na raiz
        run: |
          set -e
          echo "=== Rodando o script ==="
          python gerar_dashboard.py

          echo "=== Procurando o index.html gerado ==="
          if [ -f index.html ]; then
            echo "OK: index.html já está na raiz."
          else
            # Procura o index.html em qualquer subpasta (ignora a pasta .git)
            FOUND="$(find . -name 'index.html' -not -path './.git/*' | head -1 || true)"
            if [ -n "$FOUND" ]; then
              echo "Encontrado em: $FOUND — copiando para a raiz."
              cp "$FOUND" ./index.html
            else
              echo "❌ ERRO: nenhum index.html foi gerado."
              echo "Isso normalmente significa que a API do Comex Stat não retornou dados."
              echo "--- Arquivos gerados nesta rodada (para diagnóstico): ---"
              find . -not -path './.git/*' -newer requirements.txt -type f | head -50
              exit 1
            fi
          fi

      - name: Publicar se houver atualização
        run: |
          set -e
          # Neutraliza o campo de data/hora (aceita com ou sem espaço após ":")
          NEUTRO='s/"gerado_em": *"[^"]*"/"gerado_em":""/'
          git show HEAD:index.html 2>/dev/null | sed "$NEUTRO" > /tmp/old.html || echo "" > /tmp/old.html
          sed "$NEUTRO" index.html > /tmp/new.html
